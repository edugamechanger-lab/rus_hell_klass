<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проклятый класс — выбраться за 20 минут</title><style>
:root{color-scheme:dark;--gold:#ffca76;--violet:#a978ff;--paper:#f4e9d4}*{box-sizing:border-box}body{margin:0;background:#100d1e;color:#f9f0df;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffdb89;outline-offset:3px}.hidden{display:none!important}.shell{max-width:1540px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}.brand{font-family:Georgia,serif;font-size:clamp(21px,3vw,34px);color:var(--gold)}.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stat{border:1px solid #725589;background:#231932;border-radius:12px;padding:9px 13px}.danger{color:#ff8686;border-color:#ff7373}.scene{position:relative;width:100%;aspect-ratio:1600/1024;overflow:hidden;border-radius:18px;border:2px solid #5d456e;box-shadow:0 14px 60px #0009;background:#21152e}.scene img{width:100%;height:100%;display:block}.hotspot{position:absolute;transform:translate(-50%,-50%);width:clamp(34px,4.4vw,62px);height:clamp(34px,4.4vw,62px);border-radius:50%;background:#9a60f528;border:2px solid #e6baff;box-shadow:0 0 16px #a354ff, inset 0 0 16px #a354ff;display:grid;place-items:center;color:white;font-weight:900;text-shadow:0 1px 5px #000;font-size:20px;animation:pulse 2.6s infinite}.hotspot.done{background:#1d764cbb;border-color:#a2ffd4;box-shadow:0 0 18px #42e99a;animation:none}.door{position:absolute;left:91%;top:42%;width:15%;height:60%;transform:translate(-50%,-50%);border:0;background:transparent}.door span{position:absolute;bottom:4%;left:20%;font-size:clamp(24px,4vw,54px);filter:drop-shadow(0 0 8px #d08dff)}.door.ready{filter:drop-shadow(0 0 16px #ffd379)}@keyframes pulse{50%{box-shadow:0 0 27px #bd82ff,inset 0 0 22px #ae62ff}}.below{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 2px}.slots{display:flex;gap:8px}.slot{width:40px;height:48px;border:1px solid #9c7a9f;border-radius:9px;display:grid;place-items:center;font-size:25px;color:#ffdb93;background:#2b2038}.note{color:#d9c4e2;font-size:14px}.overlay{position:fixed;inset:0;z-index:10;background:#090612db;display:grid;place-items:center;padding:15px;overflow:auto}.panel{background:linear-gradient(140deg,#34213e,#1a172b 70%);border:1px solid #9471a2;border-radius:20px;padding:clamp(18px,4vw,34px);width:min(660px,100%);max-height:92dvh;overflow:auto;box-shadow:0 24px 90px #000a}.panel h1,.panel h2{font-family:Georgia,serif;color:var(--gold);line-height:1.2;margin:0 0 16px}.panel h1{font-size:clamp(30px,6vw,48px)}.panel h2{font-size:clamp(25px,4vw,34px)}.panel p{line-height:1.6}.eyebrow{color:#d7b1ff;letter-spacing:.13em;font-size:12px;text-transform:uppercase}.primary,.secondary{padding:12px 18px;border-radius:11px;border:1px solid #f0c17d;background:#d99843;color:#211423;font-weight:800;min-height:45px}.secondary{background:#352844;color:#f9e9fa;border-color:#816695}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.options{display:grid;gap:9px;margin-top:18px}.option{width:100%;display:flex;align-items:center;gap:12px;padding:13px;text-align:left;border-radius:12px;border:1px solid #7a6188;background:#32243e;color:#fff}.option.selected{border-color:#ffd27d;background:#59405b}.letter{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#503a65;flex-shrink:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin:10px 0}.pair select,input.code,input.answer{width:100%;min-width:0;border:1px solid #997ba2;background:#211a30;color:white;border-radius:10px;padding:12px}.feedback{margin-top:15px;padding:12px;border-radius:10px;background:#4a344f}.feedback.good{border:1px solid #7ee4a2}.feedback.bad{border:1px solid #e79b96}.hint{border-left:3px solid var(--gold);padding-left:12px;color:#f1d9b3;margin-top:14px}.code{font-size:25px;text-align:center;letter-spacing:.25em}.caption{font-size:13px;color:#d2bfd9}@media(max-width:600px){.shell{padding:7px}.scene{border-radius:9px}.hotspot{width:30px;height:30px;font-size:14px}.door span{font-size:22px}.pair{grid-template-columns:1fr}.slot{width:35px;height:42px}.brand{font-size:22px}}

/* Подсветка области предмета при наведении и фокусе */
.hotspot{width:10%;height:17%;border:0;border-radius:28%;background:transparent;box-shadow:none;animation:none;font-size:0;isolation:isolate;transition:filter .2s ease;touch-action:manipulation}
.hotspot[data-task="0"]{width:22%;height:22%}
.hotspot[data-task="1"]{width:12%;height:27%}
.hotspot[data-task="2"]{width:11%;height:25%}
.hotspot[data-task="3"]{width:15%;height:19%}
.hotspot[data-task="4"]{width:11%;height:33%}
.hotspot::before{content:"";position:absolute;inset:-8%;border-radius:inherit;background:radial-gradient(ellipse,#d9a4ff77 0%,#a955ff44 43%,transparent 73%);box-shadow:0 0 32px 12px #ab68ff88,inset 0 0 30px #e4baff66;opacity:0;transform:scale(.82);transition:opacity .22s ease,transform .22s ease;pointer-events:none;z-index:-1}
.hotspot::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(30px,4vw,54px);height:clamp(30px,4vw,54px);display:grid;place-items:center;border:2px solid #e6baff;border-radius:50%;background:#9a60f555;box-shadow:0 0 16px #a354ff,inset 0 0 12px #a354ff;color:white;font-size:20px;text-shadow:0 1px 5px #000;animation:pulse 2.6s infinite;transition:transform .22s ease,background .22s ease}
.hotspot.done::after{content:"✓";background:#1d764cbb;border-color:#a2ffd4;box-shadow:0 0 18px #42e99a;animation:none}
.hotspot:hover::before,.hotspot:focus-visible::before{opacity:1;transform:scale(1.12)}
.hotspot:hover::after,.hotspot:focus-visible::after{transform:translate(-50%,-50%) scale(1.17);background:#b77affaa;animation:none}
.hotspot.done:hover::before,.hotspot.done:focus-visible::before{background:radial-gradient(ellipse,#a2ffd477,#42e99a33,transparent 73%);box-shadow:0 0 30px #42e99a77}
.door:hover,.door:focus-visible{filter:drop-shadow(0 0 22px #e3a4ff) brightness(1.24);background:linear-gradient(90deg,transparent,#b76aff35,transparent);border-radius:20px}
@media(max-width:600px){.hotspot::after{width:30px;height:30px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.hotspot::before,.hotspot::after{transition:none;animation:none}}

let completed=[], started=false, ended=false, deadline=0, current=-1, selected=[], selections=[], timerId=null;

function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function panel(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden');}
function close(){if(started&&!ended)$('overlay').classList.add('hidden');}
function remaining(){return Math.max(0,deadline-Date.now());}
function tick(){if(!started||ended)return;let ms=remaining(),s=Math.ceil(ms/1000);$('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;$('timer').classList.toggle('danger',ms<=60000);if(ms<=0)finish(false);}
function reset(){if(timerId)clearInterval(timerId);completed=[];started=false;ended=false;current=-1;selected=[];selections=[];$('timer').textContent='20:00';$('timer').classList.remove('danger');update();panel(`<div class="eyebrow">Литература · 7 класс · 20 минут</div><h1>ПРОКЛЯТЫЙ КЛАСС</h1><h2>Выбраться за 20 минут</h2><p>В канун Хэллоуина дверь кабинета литературы захлопнулась. Художественные слова потеряли магическую силу. Пять предметов хранят загадки и цифры кода.</p><p>Исследуйте кабинет, распознавайте средства художественной выразительности, соберите пять цифр и откройте дверь до полуночи.</p><div class="actions"><button class="primary" id="start">Начать испытание</button></div>`);$('start').onclick=start;}
function start(){started=true;ended=false;deadline=Date.now()+LIMIT;close();tick();timerId=setInterval(tick,250);}
function update(){let n=completed.length;$('progress').textContent=`Испытания: ${n}/5`;$('slots').innerHTML=TASKS.map((t,i)=>`<div class="slot" aria-label="Позиция ${i+1}: ${completed.includes(i)?t.digit:'не открыта'}">${completed.includes(i)?t.digit:'?'}</div>`).join('');$('hotspots').innerHTML=TASKS.map((t,i)=>`<button type="button" class="hotspot ${completed.includes(i)?'done':''}" style="left:${t.x}%;top:${t.y}%" data-task="${i}" aria-label="${escapeHTML(t.name)}">${completed.includes(i)?'✓':'✦'}</button>`).join('');document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>openTask(Number(b.dataset.task)));$('door').classList.toggle('ready',n===TASKS.length);}
function openTask(i){if(!started||ended)return;current=i;selected=[];selections=[];let t=TASKS[i];if(completed.includes(i)){panel(`<h2>${escapeHTML(t.name)}</h2><p>Это испытание уже пройдено. Полученная цифра: <strong>${t.digit}</strong>, позиция ${i+1}.</p><button class="primary" id="back">Вернуться в кабинет</button>`);$('back').onclick=close;return;}renderTask();}
function renderTask(message='',success=false){let t=TASKS[current];let html=`<div class="eyebrow">Испытание ${current+1} из 5</div><h2>${escapeHTML(t.name)}</h2><p>${escapeHTML(t.story)}</p><p><strong>${escapeHTML(t.question)}</strong></p>`;
if(t.kind==='single'||t.kind==='multi'){html+=`<div class="options">${t.options.map((o,i)=>`<button class="option ${selected.includes(i)?'selected':''}" data-opt="${i}" type="button" aria-pressed="${selected.includes(i)}"><span class="letter">${'АБВГ'[i]}</span>${escapeHTML(o)}</button>`).join('')}</div>`;}
if(t.kind==='match'){html+=t.pairs.map((p,i)=>`<label class="pair"><span>${escapeHTML(p[0])}</span><select data-pair="${i}"><option value="">Выберите прием</option>${['Сравнение','Метафора','Олицетворение','Эпитет'].map(x=>`<option value="${x}" ${selections[i]===x?'selected':''}>${x}</option>`).join('')}</select></label>`).join('');}
if(t.kind==='text')html+='<input class="answer" id="textanswer" autocomplete="off" placeholder="Введите название приема" aria-label="Короткий ответ">';
if(message)html+=`<div class="feedback ${success?'good':'bad'}" role="status">${escapeHTML(message)}</div>`;
html+=`<div id="hint" class="hint hidden">${escapeHTML(t.hint)}</div><div class="actions"><button class="primary" id="check">Проверить</button><button class="secondary" id="showhint">Подсказка</button><button class="secondary" id="back">Вернуться в кабинет</button></div>`;
panel(html);document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.opt);if(t.kind==='single')selected=[i];else selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];document.querySelectorAll('[data-opt]').forEach(x=>{let yes=selected.includes(Number(x.dataset.opt));x.classList.toggle('selected',yes);x.setAttribute('aria-pressed',String(yes));});});document.querySelectorAll('[data-pair]').forEach(x=>x.onchange=()=>selections[Number(x.dataset.pair)]=x.value);$('check').onclick=check;$('showhint').onclick=()=>$('hint').classList.remove('hidden');$('back').onclick=close;}
function check(){if(ended||remaining()<=0){tick();return;}let t=TASKS[current],ok=false;if(t.kind==='single'||t.kind==='multi'){ok=selected.length===t.answer.length&&t.answer.every(i=>selected.includes(i));}else if(t.kind==='match'){ok=t.pairs.every((p,i)=>selections[i]===p[1]);}else{let v=$('textanswer').value.toLowerCase().trim().replace(/ё/g,'е').replace(/[.!?]/g,'');ok=v===t.answer;}
if(ok){if(!completed.includes(current))completed.push(current);update();panel(`<div class="eyebrow">Заклинание ослабло</div><h2>Верно!</h2><p>${escapeHTML(t.explain)}</p><p>Получена цифра <strong style="font-size:36px;color:#ffca76">${t.digit}</strong> для позиции ${current+1}.</p><p>${completed.length===5?'Все части собраны! Теперь нажмите на дверь.':'Продолжайте исследовать кабинет.'}</p><button class="primary" id="back">Вернуться в кабинет</button>`);$('back').onclick=close;}else{let typed=t.kind==='text'?$('textanswer').value:'';renderTask('Заклинание пока слишком сильное. Попробуйте еще раз!');if(t.kind==='text')$('textanswer').value=typed;}}
function door(){if(!started||ended)return;if(completed.length!==TASKS.length){panel(`<h2>Дверь запечатана</h2><p>Соберите все пять частей магического кода! Сейчас найдено ${completed.length} из 5.</p><button class="primary" id="back">Вернуться в кабинет</button>`);$('back').onclick=close;return;}panel(`<div class="eyebrow">Последнее испытание</div><h2>Магический замок</h2><p>Введите пять собранных цифр по порядку позиций, чтобы снять проклятие.</p><input class="code" id="code" inputmode="numeric" maxlength="5" autocomplete="off" aria-label="Магический код" placeholder="•••••"><div id="codeerror" class="feedback bad hidden" role="status">Неверный код. Попробуйте еще раз.</div><div class="actions"><button class="primary" id="unlock">Открыть дверь</button><button class="secondary" id="back">Вернуться в кабинет</button></div>`);$('unlock').onclick=()=>{if(remaining()<=0){tick();return;}if($('code').value===TASKS.map(t=>t.digit).join(''))finish(true);else $('codeerror').classList.remove('hidden');};$('back').onclick=close;}
function finish(win){if(ended)return;let elapsed=LIMIT-remaining();ended=true;started=false;clearInterval(timerId);if(win){let s=Math.floor(elapsed/1000);panel(`<div class="eyebrow">Победа</div><h1>ПРОКЛЯТИЕ СНЯТО!</h1><p>Вы вернули художественным словам их магическую силу! Все пять загадок разгаданы, и дверь открыта.</p><p><strong>Время прохождения: ${Math.floor(s/60)} мин ${s%60} сек.</strong></p><button class="primary" id="again">Сыграть еще раз</button>`);}else{$('timer').textContent='00:00';panel(`<h1>Время вышло!</h1><p>Магические часы пробили полночь. Проклятие осталось в силе, а дверь так и не открылась.</p><p>Но у вас есть еще одна попытка!</p><button class="primary" id="again">Попробовать снова</button>`);}$('again').onclick=reset;}
$('door').onclick=door;$('restart').onclick=reset;reset();
</script></body></html>
