<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проклятый класс</title><style>
*{box-sizing:border-box}body{margin:0;background:#110e22;color:#f9eee2;font:16px system-ui}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fbd084;outline-offset:2px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:15px;max-width:1200px;margin:auto}h1,h2,.brand{font-family:Georgia,serif;color:#ffce81}.brand{font-size:clamp(23px,4vw,36px)}.metrics{display:flex;gap:10px;align-items:center}.metric{background:#35233f;border:1px solid #765c80;border-radius:10px;padding:9px}.danger{color:#ff8d95}main{max-width:1200px;margin:auto;padding:0 12px 20px}.scene{position:relative;aspect-ratio:16/10;overflow:hidden;border:3px solid #715486;border-radius:20px;background:radial-gradient(ellipse at 55% 45%,#55345f,#24172f 70%);box-shadow:0 22px 60px #0009}.moon{position:absolute;top:6%;left:7%;width:21%;height:35%;border:8px solid #4b3246;border-radius:120px 120px 10px 10px;background:radial-gradient(circle at 46% 38%,#fff1b0,#a4a0c6 32%,#3d436f 73%);box-shadow:0 0 65px #aaa6ff66}.board{position:absolute;left:30%;top:29%;width:43%;height:30%;border:12px ridge #8b603e;background:#172c31;box-shadow:0 10px 25px #0008;display:grid;place-items:center;color:#e0d9d2;font:italic clamp(10px,2.1vw,26px) Georgia;text-align:center;padding:15px}.floor{position:absolute;bottom:-10%;height:43%;width:115%;left:-7%;background:repeating-linear-gradient(95deg,#6b443a 0 12%,#54352f 12% 13%);transform:perspective(500px) rotateX(35deg)}.shelf{position:absolute;top:21%;left:3%;width:22%;height:47%;background:repeating-linear-gradient(0deg,#4d2a3a 0 20%,#aa7a50 20% 23%);border:12px ridge #88623e}.shelf:before{content:'▥ ▥ ▥';font-size:clamp(20px,5vw,80px);color:#b6a1d4}.desk{position:absolute;bottom:8%;left:8%;width:64%;height:18%;border:10px solid #a57748;background:linear-gradient(#b78a59,#643c34);transform:skewX(-9deg);box-shadow:0 20px 0 #37242a}.object{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;border:2px solid #d9b3ff;border-radius:50%;height:clamp(48px,8vw,100px);width:clamp(48px,8vw,100px);background:#6938a855;color:white;font-size:clamp(23px,4vw,50px);text-shadow:0 0 12px #fff;box-shadow:0 0 20px #ae67ff,inset 0 0 25px #aa5cff;transition:transform .25s,box-shadow .25s,background .25s;animation:glow 3s infinite}.object:hover{transform:translate(-50%,-50%) scale(1.2);background:#ab6cff99;box-shadow:0 0 35px 13px #a74dff,0 0 90px 25px #9246f788;z-index:3}.object.done{border-color:#afffd8;box-shadow:0 0 20px #5fffb0;background:#176b4b99;animation:none}.object.done:hover{box-shadow:0 0 35px #5fffb0}.door{position:absolute;right:2%;top:16%;width:18%;height:71%;border:9px ridge #a87547;border-radius:80px 80px 5px 5px;background:linear-gradient(90deg,#372b4c,#614467,#291c37);box-shadow:inset 0 0 40px #120e21,0 0 25px #805292;text-align:center;color:#ffd189;font-size:clamp(15px,3vw,35px);transition:filter .3s}.door:hover,.door.ready{filter:drop-shadow(0 0 20px #f5bb72)}.door span{display:block;position:absolute;top:44%;left:10%;right:10%}.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 5px}.slots{display:flex;gap:8px}.slot{border:1px solid #c7a0c7;background:#352741;color:#ffda91;font-size:27px;display:grid;place-items:center;width:44px;height:50px;border-radius:9px}.overlay{position:fixed;inset:0;background:#080512d9;display:grid;place-items:center;padding:14px;z-index:10}.hidden{display:none!important}.panel{width:min(660px,100%);max-height:92dvh;overflow:auto;padding:clamp(18px,4vw,34px);border:1px solid #a079aa;border-radius:20px;background:linear-gradient(130deg,#36233d,#1a152c);box-shadow:0 18px 75px #0009}p{line-height:1.6}h1{font-size:clamp(28px,5vw,45px)}h2{font-size:clamp(24px,4vw,34px)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.primary,.secondary{border-radius:10px;padding:12px 16px;min-height:45px;border:1px solid #ffd28c;background:#dca14c;color:#261522;font-weight:700}.secondary{background:#3a2949;color:white;border-color:#8f6c9a}.option{display:flex;gap:11px;width:100%;text-align:left;background:#30233d;color:#fff;border:1px solid #8e7499;border-radius:10px;padding:13px;margin:9px 0}.option.selected{background:#645073;border-color:#ffcf7a}.pair{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px;margin:12px 0}select,input{width:100%;min-width:0;padding:11px;border:1px solid #9376a1;background:#251b32;color:#fff;border-radius:9px}.hint{border-left:3px solid #ffcb78;margin-top:12px;padding:8px 12px;color:#ffe4bc}.feedback{padding:12px;border:1px solid #d99f92;border-radius:9px;margin-top:13px}.good{border-color:#7fe4a1}.note{color:#dac1e4;font-size:14px}@keyframes glow{50%{box-shadow:0 0 35px #cc84ff,inset 0 0 35px #ad62ff}}@media(max-width:550px){.pair{grid-template-columns:1fr}.scene{aspect-ratio:4/5}.object{height:45px;width:45px;font-size:24px}.board{left:27%;width:46%;height:28%}.door{width:20%}.metrics{flex-wrap:wrap}}
</style></head><body><header><div class="brand">Проклятый класс</div><div class="metrics"><div class="metric" id="time">20:00</div><div class="metric" id="progress">Испытания: 0/5</div><button class="secondary" id="restart">Заново</button></div></header><main><section class="scene" aria-label="Заколдованный кабинет"><div class="moon"></div><div class="shelf"></div><div class="board">Слова потеряли свою магию...</div><div class="floor"></div><div class="desk"></div><button class="object" style="left:20%;top:77%" data-id="0" aria-label="Заколдованная книга">📖</button><button class="object" style="left:21%;top:28%" data-id="1" aria-label="Говорящий портрет">🖼️</button><button class="object" style="left:51%;top:16%" data-id="2" aria-label="Магические часы">🕰️</button><button class="object" style="left:57%;top:78%" data-id="3" aria-label="Тыква с загадкой">🎃</button><button class="object" style="left:78%;top:45%" data-id="4" aria-label="Зеркало призраков">🪞</button><button class="door" id="door" aria-label="Запертая дверь"><span>🔒<br>Дверь</span></button></section><div class="foot"><div><strong>Собранный магический код</strong><div class="note">Цифры появляются на своих позициях.</div></div><div class="slots" id="slots"></div></div><p class="note">Нажимайте на светящиеся предметы. Дверь откроется после всех пяти испытаний и правильного кода.</p></main><div class="overlay" id="overlay"><section class="panel" id="panel" aria-live="polite"></section></div><script>
const tasks=[["Заколдованная книга","single","В строке «В саду горели золотые листья» найдите эпитет.","горели|золотые|саду|листья","1","Найдите образное определение.","«Золотые» — образное определение.",7],["Говорящий портрет","multi","Выберите все предложения с олицетворением.","Ветер сердито стучал в окно.|Озеро блестело, как зеркало.|Старый дом задумчиво молчал.|На столе лежала толстая книга.","0,2","Ищите человеческие действия у неживых предметов.","Ветру и дому приписаны человеческие действия.",3],["Магические часы","match","Сопоставьте выражения и приемы.","Белый, словно снег|Море огней|Лес проснулся|Бархатная ночь","Сравнение|Метафора|Олицетворение|Эпитет","Обратите внимание на союзы сравнения и переносное значение.","У каждого примера есть признаки соответствующего приема.",9],["Тыква с загадкой","text","«Вдали разлилось море пшеницы». Назовите прием в выражении «море пшеницы».","","метафора","Название одного явления перенесено на другое.","Пшеничное поле образно названо морем.",2],["Зеркало призраков","multi","Найдите все предложения со сравнением.","Облака плыли, словно белые корабли.|Солнце улыбалось над лесом.|Река извивалась, как серебряная лента.|На небе вспыхнули золотые звезды.","0,2","Ищите союзы «как» и «словно».","Сравнения построены с союзами «словно» и «как».",5]],$=s=>document.getElementById(s);let solved=new Set(),running=false,done=false,end=0,timer=null,cur=0,chosen=[],matches=[];
function show(s){$('panel').innerHTML=s;$('overlay').classList.remove('hidden')}function close(){if(running&&!done)$('overlay').classList.add('hidden')}function remaining(){return Math.max(0,end-Date.now())}function update(){let s=Math.ceil(remaining()/1000);$('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('time').classList.toggle('danger',s<=60);if(running&&s===0)finish(false)}function sync(){$('progress').textContent='Испытания: '+solved.size+'/5';$('slots').innerHTML=tasks.map((t,i)=>'<span class="slot">'+(solved.has(i)?t[7]:'?')+'</span>').join('');document.querySelectorAll('.object').forEach(x=>x.classList.toggle('done',solved.has(+x.dataset.id)));$('door').classList.toggle('ready',solved.size===5)}
function reset(){clearInterval(timer);solved.clear();running=false;done=false;end=0;$('time').textContent='20:00';sync();show('<h1>ПРОКЛЯТЫЙ КЛАСС</h1><h2>Выбраться за 20 минут</h2><p>В канун Хэллоуина кабинет литературы оказался заколдован. Пять предметов хранят литературные загадки и цифры тайного кода.</p><p>Исследуйте кабинет, находите средства художественной выразительности и откройте дверь до истечения времени.</p><button class="primary" id="start">Начать испытание</button>');$('start').onclick=()=>{running=true;end=Date.now()+1200000;timer=setInterval(update,250);close();update()}}
function openTask(i){if(!running||done)return;cur=i;chosen=[];matches=[];if(solved.has(i)){show('<h2>'+tasks[i][0]+'</h2><p>Испытание уже пройдено. Цифра '+tasks[i][7]+'.</p><button class="primary" id="back">Вернуться</button>');$('back').onclick=close;return}render()}
function render(msg=''){let t=tasks[cur],html='<h2>'+t[0]+'</h2><p>'+t[2]+'</p>';if(['single','multi'].includes(t[1]))html+=t[3].split('|').map((x,i)=>'<button class="option '+(chosen.includes(i)?'selected':'')+'" data-choice="'+i+'">'+('АБВГ'[i])+'. '+x+'</button>').join('');if(t[1]==='match')html+=t[3].split('|').map((x,i)=>'<label class="pair"><span>'+x+'</span><select data-match="'+i+'"><option value="">Выберите прием</option>'+t[4].split('|').map(a=>'<option value="'+a+'" '+(matches[i]===a?'selected':'')+'>'+a+'</option>').join('')+'</select></label>').join('');if(t[1]==='text')html+='<input id="answer" placeholder="Введите прием" autocomplete="off">';if(msg)html+='<p class="feedback">'+msg+'</p>';html+='<p class="hint hidden" id="hint">'+t[5]+'</p><div class="actions"><button class="primary" id="check">Проверить</button><button class="secondary" id="help">Подсказка</button><button class="secondary" id="back">В кабинет</button></div>';show(html);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let k=+b.dataset.choice;chosen=t[1]==='single'?[k]:chosen.includes(k)?chosen.filter(v=>v!==k):[...chosen,k];document.querySelectorAll('[data-choice]').forEach(o=>o.classList.toggle('selected',chosen.includes(+o.dataset.choice)))});document.querySelectorAll('[data-match]').forEach(s=>s.onchange=()=>matches[+s.dataset.match]=s.value);$('help').onclick=()=>$('hint').classList.remove('hidden');$('back').onclick=close;$('check').onclick=check}
function check(){if(remaining()<=0){update();return}let t=tasks[cur],ok=false;if(['single','multi'].includes(t[1])){let a=t[4].split(',').map(Number);ok=chosen.length===a.length&&a.every(x=>chosen.includes(x))}else if(t[1]==='match')ok=t[4].split('|').every((x,i)=>matches[i]===x);else ok=$('answer').value.trim().toLowerCase().replace(/ё/g,'е').replace(/[.!?]/g,'')===t[4];if(!ok){let v=t[1]==='text'?$('answer').value:'';render('Заклинание пока слишком сильное. Попробуйте еще раз!');if(t[1]==='text')$('answer').value=v;return}solved.add(cur);sync();show('<h2>Верно! Заклинание ослабло</h2><p>'+t[6]+'</p><p>Вы получили цифру <strong style="font-size:30px;color:#ffd080">'+t[7]+'</strong> для позиции '+(cur+1)+'.</p><p>'+(solved.size===5?'Все цифры собраны. Теперь откройте дверь!':'Ищите следующий предмет.')+'</p><button class="primary" id="back">В кабинет</button>');$('back').onclick=close}
function door(){if(!running||done)return;if(solved.size<5){show('<h2>Дверь запечатана</h2><p>Соберите все пять частей кода! Найдено '+solved.size+' из 5.</p><button class="primary" id="back">В кабинет</button>');$('back').onclick=close;return}show('<h2>Магический замок</h2><p>Введите собранные цифры по порядку позиций.</p><input id="code" inputmode="numeric" maxlength="5" placeholder="Пять цифр"><p id="error" class="feedback hidden">Код неверный. Попробуйте снова.</p><div class="actions"><button class="primary" id="unlock">Открыть дверь</button><button class="secondary" id="back">В кабинет</button></div>');$('unlock').onclick=()=>{if(remaining()<=0){update();return}if($('code').value===tasks.map(t=>t[7]).join(''))finish(true);else $('error').classList.remove('hidden')};$('back').onclick=close}
function finish(won){if(done)return;let elapsed=1200000-remaining();done=true;running=false;clearInterval(timer);show(won?'<h1>ПРОКЛЯТИЕ СНЯТО!</h1><p>Вы разгадали все загадки, собрали магический код и выбрались!</p><p>Время прохождения: '+Math.floor(elapsed/60000)+' мин '+Math.floor(elapsed/1000)%60+' сек.</p><button class="primary" id="again">Сыграть еще раз</button>':'<h1>Время вышло!</h1><p>Магические часы пробили полночь. Проклятие осталось в силе, а дверь не открылась.</p><button class="primary" id="again">Попробовать снова</button>');$('again').onclick=reset}
document.querySelectorAll('.object').forEach(x=>x.onclick=()=>openTask(+x.dataset.id));$('door').onclick=door;$('restart').onclick=reset;reset();
</script></body></html>
